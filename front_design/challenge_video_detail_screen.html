<h2 class="sr-only">방 안 특정 챌린지 영상의 상세 화면 - 대표 영상, 제출 영상 그리드, 댓글 진입점 포함</h2>
<div style="background: var(--surface-1); border-radius: 20px; padding: 16px; display: flex; justify-content: center;">
<div style="width: 320px; height: 700px; background: var(--surface-2); border-radius: 24px; border: 0.5px solid var(--border); overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 16px 18px 6px; display: flex; align-items: center; justify-content: space-between;">
    <i class="ti ti-arrow-left" style="font-size: 19px; color: var(--text-primary);" aria-hidden="true"></i>
    <span style="font-size: 14px; font-weight: 500; color: var(--text-primary);">3초 텐션 올리기</span>
    <i class="ti ti-dots-vertical" style="font-size: 19px; color: var(--text-primary);" aria-hidden="true"></i>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 10px 18px 0;">
    <div style="display: flex; gap: 12px; margin-bottom: 16px;">
      <div style="width: 88px; height: 156px; border-radius: 14px; overflow: hidden; flex-shrink: 0; background: #FAECE7; position: relative; display: flex; align-items: center; justify-content: center;">
        <i class="ti ti-player-play-filled" style="font-size: 26px; color: #D85A30;" aria-hidden="true"></i>
        <span style="position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 5px;">Shorts</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0;">
        <div>
          <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 8px;">2/4명 제출 완료</div>
          <div style="display: flex;">
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #FF4470; border: 1.5px solid #00B894; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 500;">민</div>
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #00B894; border: 1.5px solid #00B894; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 500;">서</div>
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #888780; border: 1.5px solid var(--surface-2); margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 500;">하</div>
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #D62E56; border: 1.5px solid var(--surface-2); margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 500;">지</div>
          </div>
        </div>
        <button style="width: 100%; height: 40px; border-radius: 10px; border: none; background: #FF4470; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px;">
          <i class="ti ti-video" style="font-size: 15px;" aria-hidden="true"></i>따라 찍기
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 0.5px solid var(--border);">
      <i class="ti ti-message-circle" style="font-size: 16px; color: var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size: 12px; color: var(--text-secondary);">이 영상에 댓글 5개</span>
    </div>

    <div style="font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px;">제출된 영상</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div style="border-radius: 12px; overflow: hidden; background: #FAECE7; aspect-ratio: 9/16; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 8px;">
        <span></span>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 11px; font-weight: 500; color: var(--text-primary); background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 6px;">민지</span>
          <span style="font-size: 10px; color: var(--text-primary); background: rgba(255,255,255,0.85); padding: 2px 5px; border-radius: 5px; display: flex; align-items: center; gap: 2px;"><i class="ti ti-message-circle" style="font-size: 10px;" aria-hidden="true"></i>2</span>
        </div>
      </div>
      <div style="border-radius: 12px; overflow: hidden; background: #E1F5EE; aspect-ratio: 9/16; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 8px;">
        <span></span>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 11px; font-weight: 500; color: var(--text-primary); background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 6px;">서준</span>
          <span style="font-size: 10px; color: var(--text-primary); background: rgba(255,255,255,0.85); padding: 2px 5px; border-radius: 5px; display: flex; align-items: center; gap: 2px;"><i class="ti ti-message-circle" style="font-size: 10px;" aria-hidden="true"></i>1</span>
        </div>
      </div>
    </div>
  </div>

</div>
